#############################################################################
# File: syslog-ng-test-logrot-crash-recovery.conf
# syslog-ng configuration for log rotation with Crash Recovery in syslog-ng
#
# This conf file is for local test with netcat command, e.g.:
# nc -u 127.0.0.1 7777 < some_file.txt
# or
# cat some_file.txt | nc -u 127.0.0.1 7777
#############################################################################

@version: 4.8
@include "scl.conf"
@module "cr_destination"

@define mypath "/tmp/test_slog/data"

options {
    flush_lines (0);
    time_reopen (10);
    log_fifo_size (1000);
    chain_hostnames (off);
    use_dns (no);
    use_fqdn (no);
    create_dirs (no);
    keep_hostname (yes);
    use-uniqid(yes);
};

source s_local {
        system();
        internal();
};

source s_network {
        network(
                transport("udp")
                port(7777)
                flags(store-raw-message)
        );
};

# cr_destination provides a log rotation where the log rotates after exact
# count of log entries and this number is defined by logrotcnt(<number>).
# Number logrotcnt should be greater then 1000 to ensure reasonably
# reliable Crash Recovery.
# (For the sake of completeness, it should be mentioned that logrotcnt MUST be
# greater than THE_K, which is hard coded to 5)
# see https://eprint.iacr.org/2019/506.pdf, p 22, fig 3

destination d_local_cr {
    cr_destination(
        filenametoken("`mypath`/cr_log"),
        keypath("`mypath`/master.key"),
        dir("`mypath`"),
        mode("enc"), # provide plain logs as well as Crash Recovery encrypted files
        logrotcnt(50),  # MAX_MESSAGES_PER_FILE, 50 is not reliable, but works most of the time.
    );
};

log {
        source(s_network);
        destination(d_local_cr);
};
